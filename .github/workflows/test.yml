name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    name: shellcheck install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          shellcheck -s bash install.sh
          shellcheck -s bash tests/test_install_sh.sh

  bash-integration:
    name: bash installer integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: ensure python3 for mock server
        run: python3 --version
      - name: run integration tests
        run: |
          chmod +x install.sh tests/test_install_sh.sh
          bash tests/test_install_sh.sh

  psscriptanalyzer:
    name: PSScriptAnalyzer install.ps1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
      - name: analyze
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error,Warning
          if ($issues) {
            $issues | Format-Table -AutoSize
            throw "PSScriptAnalyzer reported $($issues.Count) issues"
          }

  powershell-integration:
    name: PowerShell installer integration (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: run integration tests
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File tests/Test-InstallPs1.ps1
